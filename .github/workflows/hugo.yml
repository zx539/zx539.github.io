name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - codex/sakura-template-layout
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/sakura-template-layout'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.131.0'
          extended: true
      - name: Build
        run: hugo --gc --minify --cleanDestinationDir --panicOnWarning
      - name: Test
        run: |
          node tests/daily-scene.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
