<div class="reading-progress" data-reading-progress aria-hidden="true"></div>
<aside class="site-tools" aria-label="页面工具">
  <time class="site-clock" data-site-clock aria-label="本地时间">--:--:--</time>
  <button type="button" data-video-toggle aria-label="暂停背景视频" title="暂停背景视频">Ⅱ</button>
  <button type="button" data-scroll-top aria-label="返回顶部" title="返回顶部">↑</button>
</aside>
<script>
  (() => {
    const root = document.documentElement;
    const progress = document.querySelector("[data-reading-progress]");
    const scrollTopButton = document.querySelector("[data-scroll-top]");
    const videoButton = document.querySelector("[data-video-toggle]");
    const video = document.querySelector("[data-ambient-video]");
    const clock = document.querySelector("[data-site-clock]");
    let scrollFrame = 0;

    const updateScroll = () => {
      const max = root.scrollHeight - innerHeight;
      const value = max > 0 ? scrollY / max : 0;
      progress.style.transform = `scaleX(${Math.min(1, Math.max(0, value))})`;
      scrollTopButton.classList.toggle("is-visible", scrollY > 360);
      scrollFrame = 0;
    };

    const requestScrollUpdate = () => {
      if (scrollFrame) return;
      scrollFrame = requestAnimationFrame(updateScroll);
    };

    const clockFormat = new Intl.DateTimeFormat("zh-CN", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23",
    });
    const updateClock = () => {
      const now = new Date();
      clock.textContent = clockFormat.format(now);
      clock.dateTime = now.toISOString();
    };

    const syncVideoButton = () => {
      const paused = video.paused;
      videoButton.textContent = paused ? "▶" : "Ⅱ";
      videoButton.setAttribute("aria-label", paused ? "播放背景视频" : "暂停背景视频");
      videoButton.title = paused ? "播放背景视频" : "暂停背景视频";
    };

    scrollTopButton.addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
    videoButton.addEventListener("click", async () => {
      if (video.paused) {
        try { await video.play(); } catch (_) {}
      } else {
        video.pause();
      }
      syncVideoButton();
    });
    video.addEventListener("play", syncVideoButton);
    video.addEventListener("pause", syncVideoButton);
    video.addEventListener("error", syncVideoButton);

    document.querySelectorAll(".article-body pre").forEach((pre) => {
      const code = pre.querySelector("code");
      const button = document.createElement("button");
      button.className = "code-copy";
      button.type = "button";
      button.textContent = "复制";
      button.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(code ? code.innerText : pre.childNodes[0]?.textContent || "");
          button.textContent = "已复制";
        } catch (_) {
          button.textContent = "复制失败";
        }
        window.setTimeout(() => { button.textContent = "复制"; }, 1400);
      });
      pre.appendChild(button);
    });

    addEventListener("scroll", requestScrollUpdate, { passive: true });
    addEventListener("resize", requestScrollUpdate);
    updateScroll();
    updateClock();
    syncVideoButton();
    window.setInterval(updateClock, 1000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) updateClock();
    });
  })();
</script>
