<header class="site-header">
  {{ $profile := site.Data.profile }}
  <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="回到首页">
    <img class="brand-avatar" src="{{ $profile.avatar | relURL }}" alt="{{ $profile.name }}的头像" width="40" height="40">
    <span>{{ site.Params.author }}</span>
  </a>
  <nav class="site-nav" aria-label="主导航">
    <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>首页</a>
    <a href="{{ "about/" | relURL }}"{{ if eq .RelPermalink ("about/" | relURL) }} aria-current="page"{{ end }}>关于</a>
    <a href="{{ "posts/" | relURL }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>博客</a>
    <a href="{{ "weekly/" | relURL }}"{{ if eq .Section "weekly" }} aria-current="page"{{ end }}>周报</a>
    <a href="{{ "photos/" | relURL }}"{{ if eq .Section "photos" }} aria-current="page"{{ end }}>每日一景</a>
  </nav>
</header>
