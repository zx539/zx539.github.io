{{ define "main" }}
  <div class="sakura-fall" aria-hidden="true">
    {{ range seq 1 28 }}<i style="--petal-index: {{ . }}"></i>{{ end }}
  </div>
  <div class="sakura-dashboard">
    {{ partial "home-sidebar.html" . }}
    <div class="sakura-feed">
      {{ partial "hero.html" . }}
      {{ partial "posts.html" . }}
      {{ partial "projects.html" . }}
      {{ partial "weekly.html" . }}
    </div>
    {{ partial "home-rail.html" . }}
  </div>
{{ end }}
